<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Изменение внешнего вида DIV в разных размерах экрана — schoolsw3.com</title>
  <style>
  @media screen and (max-width: 900px) and (min-width: 600px), (min-width: 1100px) {
   div.example{
     font-size: 50px;
     padding: 50px;
     border: 8px solid black;
     background: yellow;
   }
  }
  </style>
 </head>
 <body>

  <h1>CSS Изменение внешнего вида DIV в разных размерах экрана</h1>

  <div class="example">Пример DIV.</div>

  <p>Если ширина браузера составляет от 600 до 900px или выше 1100px, измените внешний вид DIV. 
  <strong>Изменить размер окна браузера, чтобы увидеть эффект</strong>.</p>

 </body>
</html>
