<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Псевдоэлементы ::first-letter и ::first-line</title>
    <style>
        /* Стиль для первого символа каждого абзаца */
        ::first-letter {
            color: red;          /* красный цвет для первой буквы */
            font-size: 24px;     /* увеличенный размер шрифта */
        }

        /* Стиль для первой строки элемента с классом test */
        .test::first-line {
            color: green;        /* зелёный цвет для первой строки */
            font-family: Arial;  /* шрифт Arial */
        }
    </style>
</head>
<body>
    <!-- Первый абзац: красная первая буква "Я" -->
    <p>Яндекс. Найдется, всё.</p>

    <!-- Второй абзац с классом test:
         - первая буква "У" красная (общий ::first-letter)
         - первая строка "У лукоморья дуб" зелёная и шрифтом Arial -->
    <p class="test">У лукоморья дуб</p>

    <!-- Третий абзац:
         - первая буква "З" красная
         - весь текст обычного цвета (без .test) -->
    <p>Златая цепь на дубе том:<br>
    И днём и ночью кот учёный<br>
    Всё ходит по цепи кругом;<br>
    Идёт направо - песнь заводит,<br>
    Налево - сказку говорит.</p>
</body>
</html>
