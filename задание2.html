<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адаптивное меню</title>
  <style>
  * {
    box-sizing: border-box;
  }

  /* Стиль верхней панели навигации */
  .menu {
    overflow: hidden;
    background-color: #6583af;
  }

  /* Стиль верхних навигационных ссылок */
  .menu a {
    float: left;
    display: block;
    color: #f2f2f2;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
  }

  /* Изменение цвета при наведении */
  .menu a:hover {
    background-color: #ddd;
    color: #6583af;
  }

  /* На экранах, которые 600px шириной или меньше, сделать ссылки меню стек поверх друг друга, а не рядом друг с другом */
  @media screen and (max-width: 600px) {
  .menu a {
    float: none;
    width: 100%;
  }
  }
  </style>
 </head>
 <body>

  <h1>Адаптивное меню</h1>

  <div class="menu">
   <a href="#">Главная</a>
   <a href="#">О нас</a>
   <a href="#">Услуги</a>
   <a href="#">Контакты</a>
  </div>
 </body>
</html>
