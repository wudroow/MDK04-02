<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <title>Псевдокласс :focus</title>
<style>
input:focus { /* выбирает все элементы <input>, которые находятся в фокусе */
background-color: rgb(231, 2, 2); /* устанавливаем цвет заднего фона */
color: rgb(255, 255, 255); /* устанавливаем цвет шрифта */
font-size: 18px; /* устанавливаем размер шрифта */
border: 2px solid rgb(0, 0, 0); /* устанавливаем сплошную границу оранжевого цвета размером 2 пикселя */
}
</style>
</head>
<body>
<form>
    Логин <input type = "text" name = "login"><br><br>
    Пароль <input type = "password" name = "password">
</form>
</body>
</html>
